version: '3.8'

services:
  mcp-server-manager:
    build:
      context: .
      dockerfile: Dockerfile
    image: mcp-server-manager:${APP_VERSION:-1.2.0}
    container_name: mcp-server-manager
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - mcp-network

networks:
  mcp-network:
    driver: bridge
